site_name: zarr-datafusion-search
repo_name: developmentseed/zarr-datafusion-search
repo_url: https://github.com/developmentseed/zarr-datafusion-search
site_description: Query Zarr metadata with DataFusion SQL
site_author: Development Seed
site_url: https://developmentseed.github.io/zarr-datafusion-search/
docs_dir: docs

extra:
  social:
    - icon: "fontawesome/brands/github"
      link: "https://github.com/developmentseed"
    - icon: "material/web"
      link: "https://developmentseed.org/"

exclude_docs: |
  superpowers/

nav:
  - index.md
  - User Guide:
      - user-guide/installation.md
      - user-guide/quickstart.md
  - API Reference:
      - api/zarr-table.md
      - api/ingest.md
  - Examples:
      - examples/quickstart.ipynb
      - examples/spatial_index.ipynb
      - examples/stac_virtualizarr.ipynb
  - Architecture:
      - architecture/zarr.md
      - architecture/query-pipeline.md
  - Developer Docs: DEVELOP.md

theme:
  language: en
  name: material
  custom_dir: docs/overrides
  logo: assets/logo_no_text.png
  favicon: assets/ds_favicon.png
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      primary: default
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: default
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

  font:
    text: Roboto
    code: Roboto Mono

  features:
    - content.code.annotate
    - content.code.copy
    - navigation.indexes
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.share

extra_css:
  - overrides/stylesheets/extra.css

watch:
  - python/python

plugins:
  - search
  - mkdocs-jupyter:
      execute: false
  - mkdocstrings:
      handlers:
        python:
          paths: [python/python]
          options:
            allow_inspection: false
            docstring_style: google
            docstring_section_style: list
            line_length: 80
            separate_signature: true
            show_root_heading: true
            show_signature_annotations: true
            show_source: false
            show_symbol_type_toc: true
            signature_crossrefs: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.magiclink:
      hide_protocol: true
      repo_url_shortener: true
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
